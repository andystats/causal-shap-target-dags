name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check contributor metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE_SHA}..${HEAD_SHA}"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${HEAD_SHA}^!"
          else
            RANGE="${BEFORE_SHA}..${HEAD_SHA}"
          fi
          if git log --format='%B' "$RANGE" | grep -Eiq '^Co-authored-by:.*(Claude|Anthropic)'; then
            echo 'Automated assistants must not be listed as commit co-authors.' >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with Workbench dependencies
        run: python -m pip install -e ".[workbench]"
      - name: Compile and test
        working-directory: app
        run: |
          python -m compileall -q causal_shap stages tests workbench hub app.py
          python -m unittest discover -s tests -v
      - name: Smoke-test Workbench app
        working-directory: app/workbench
        run: python -c "import app"
      - name: Smoke-test Hub app
        working-directory: app
        run: python -c "import hub.app"
      - name: Smoke-test M1-M5 battery runner
        run: python analysis/run_m1_m5_battery.py --example toy --output-dir "${{ runner.temp }}/battery-smoke"
      - name: Validate bundles and frozen output
        working-directory: app
        run: python -m causal_shap.build validate
      - name: Assert bundle manifest resolves
        working-directory: app
        run: python -c "from pathlib import Path; from causal_shap.bundles import BundleRepository; errors=BundleRepository(Path('.'), Path('bundles/manifest.json')).validate(); assert not errors, errors"
