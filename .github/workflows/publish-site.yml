name: Publish site from the hub

# This repository's GitHub Pages serves the Space SHAP site, which is authored
# in ahhatype/causal-shap-spaceflight-renal-stones under site/. Pages on that
# repository is an owner-only setting, so the deploy runs here: check out the
# hub's main, render, publish. Triggers: a push here, every six hours, or
#   gh workflow run "Publish site from the hub" -R andystats/causal-shap-target-dags

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the hub
        uses: actions/checkout@v4
        with:
          repository: ahhatype/causal-shap-spaceflight-renal-stones
          ref: main
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render the hub site (no analysis execution)
        run: quarto render site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site
      - id: deployment
        uses: actions/deploy-pages@v4
